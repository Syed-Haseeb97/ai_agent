name: Autonomous Agent and Cursor Companion Tests
on:
  push:
    branches: [main, feature/autonomous-agent-mode, feature/ruby-cursor-follow]
  pull_request:
    branches: [main, feature/ruby-companion-ui-polish]
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install mss Pillow python-dotenv PyQt6
      - run: python -m unittest discover -s tests -p 'test_autonomous_agent.py' -v
      - run: python -m unittest discover -s tests -p 'test_cursor_companion.py' -v
