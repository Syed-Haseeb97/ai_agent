name: Autonomous Agent Tests
on:
  push:
    branches: [main, feature/autonomous-agent-mode, feature/f16-reliability-baseline]
  pull_request:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install mss Pillow python-dotenv psutil
      - run: python -m unittest discover -s tests -p 'test_autonomous_agent.py' -v
      - run: python -m unittest discover -s tests -p 'test_agent_verifier.py' -v
