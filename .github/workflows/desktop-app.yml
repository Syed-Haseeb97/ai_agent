name: Desktop app build

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop_app/**"
      - "background_agent/**"
      - "ai/gemini_client.py"
      - "packaging/**"
      - "requirements-desktop.txt"
      - "requirements-desktop-build.txt"
      - ".github/workflows/desktop-app.yml"
  push:
    branches: [main]
    paths:
      - "desktop_app/**"
      - "background_agent/**"
      - "ai/gemini_client.py"
      - "packaging/**"
      - "requirements-desktop.txt"
      - "requirements-desktop-build.txt"
      - ".github/workflows/desktop-app.yml"

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop_app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-desktop.txt -r requirements-desktop-build.txt
        working-directory: .
      - run: npm ci
        working-directory: desktop_app
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: desktop_app
      - run: npm run desktop:dist
        working-directory: desktop_app
      - run: npm run smoke:backend:packaged
        working-directory: desktop_app
        env:
          RUBY_SMOKE_GEMINI_KEY: offline-smoke-key-no-provider-request
