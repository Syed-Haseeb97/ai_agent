name: Background agent tests

on:
  pull_request:
    branches: [main]
    paths:
      - "background_agent/**"
      - "tests/background_agent/**"
      - "requirements-background.txt"
      - "requirements-bridge.txt"
      - ".github/workflows/background-agent-tests.yml"
  push:
    branches: [main]
    paths:
      - "background_agent/**"
      - "tests/background_agent/**"
      - "requirements-background.txt"
      - "requirements-bridge.txt"
      - ".github/workflows/background-agent-tests.yml"

jobs:
  background-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-bridge.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q background_agent tests/background_agent
      - run: python -m unittest discover -s tests/background_agent -p 'test_bg_*.py' -v
