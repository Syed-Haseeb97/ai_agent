name: Ruby emotion regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "ai/emotion.py"
      - "ai/gemini_client.py"
      - "ui/liquid_blob.py"
      - "ui/floating_button.py"
      - "tests/test_emotion_parser.py"
      - "tests/test_liquid_blob_moods.py"
      - ".github/workflows/emotion-tests.yml"
  push:
    branches: [feature/ruby-emotional-expressions]
    paths:
      - "ai/emotion.py"
      - "ai/gemini_client.py"
      - "ui/liquid_blob.py"
      - "ui/floating_button.py"
      - "tests/test_emotion_parser.py"
      - "tests/test_liquid_blob_moods.py"
      - ".github/workflows/emotion-tests.yml"

jobs:
  emotion-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest PyQt6
      - name: Run emotion regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_emotion_parser.py tests/test_liquid_blob_moods.py
